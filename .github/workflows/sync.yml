name: Garmin Daily Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-garmin-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Garmin script
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: |
          python3 garmin_sync.py

      - name: Commit and push updated csv
        run: |
          git config --global user.name "Garmin Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git status
          git add -A
          git diff --cached --quiet || (git commit -m "Automated Garmin sync update [skip ci]" && git push)

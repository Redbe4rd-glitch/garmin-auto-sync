name: Push Workout to Intervals.icu

on:
  workflow_dispatch:
    inputs:
      workout_date:
        description: 'Datum för passet (YYYY-MM-DD)'
        required: true
        default: ''
      workout_json:
        description: 'Passstruktur i JSON-format (valfritt)'
        required: false
        default: ''

jobs:
  push-workout:
    runs-on: ubuntu-latest
    steps:
      - name: Send Workout via API
        env:
          API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          WORKOUT_DATE: ${{ github.event.inputs.workout_date }}
          WORKOUT_JSON: ${{ github.event.inputs.workout_json }}
        run: |
          python -c "
          import os, json, urllib.request, base64

          api_key = os.environ['API_KEY']
          workout_date = os.environ['WORKOUT_DATE']
          workout_json = os.environ['WORKOUT_JSON'].strip()

          url = 'https://intervals.icu/api/v1/athlete/0/events'
          auth_header = base64.b64encode(f'API_KEY:{api_key}'.encode('utf-8')).decode('utf-8')

          # Om inget anges, använd standardpasset (Pyramiden)
          if not workout_json:
              default_desc = '- 5m Warmup 60-70% HR\n\nMain Set 1x\n- 1m 70-80% HR\n- 30s 50-60% HR\n- 2m 70-80% HR\n- 1m 50-60% HR\n- 3m 70-80% HR\n- 1m 50-60% HR\n- 4m 70-80% HR\n- 1m 50-60% HR\n- 3m 70-80% HR\n- 1m 50-60% HR\n- 2m 70-80% HR\n- 1m 50-60% HR\n- 1m 70-80% HR\n- 30s 50-60% HR\n\n- 5m Cooldown 60-70% HR'
              workout_data = {'filename': 'Pyramiden.txt', 'description': default_desc}
          else:
              try:
                  workout_data = json.loads(workout_json)
              except Exception as e:
                  print('Kunde inte avläsa JSON, använder standardpass:', e)
                  workout_data = {'filename': 'Pass.txt', 'description': workout_json}

          payload = {
              'category': 'WORKOUT',
              'start_date_local': f'{workout_date}T00:00:00',
              'type': 'Run',
              'filename': workout_data.get('filename', 'Pass.txt'),
              'description': workout_data.get('description', '')
          }

          req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={
              'Authorization': f'Basic {auth_header}',
              'Content-Type': 'application/json'
          }, method='POST')

          try:
              with urllib.request.urlopen(req) as resp:
                  print('Status:', resp.status)
                  print('Response:', resp.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
              print('HTTPError:', e.code, e.reason)
              print(e.read().decode('utf-8'))
              exit(1)
          except Exception as e:
              print('Error:', e)
              exit(1)
          "

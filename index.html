<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Coach Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --accent-green: #4ade80;
            --accent-warn: #fbbf24;
            --accent-alert: #f87171;
            --text: #f8fafc;
            --subtext: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background-color: var(--card);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--subtext);
            margin-bottom: 8px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .metric-box {
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-val {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text);
            margin-top: 4px;
        }

        .status-ok { color: var(--accent-green); }
        .status-warn { color: var(--accent-warn); }
        .status-alert { color: var(--accent-alert); }

        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--subtext);
            border-radius: 8px;
            color: var(--text);
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 0.85rem;
            margin-top: 8px;
            resize: none;
        }

        #status-msg {
            font-size: 0.85rem;
            color: var(--subtext);
        }
    </style>
</head>
<body>

    <h1>🏃 Garmin Coach Dashboard</h1>
    <div id="status-msg">Hämtar färsk träningsdata från din CSV...</div>

    <div class="card">
        <div class="card-title">Senaste passet</div>
        <div id="last-activity" style="font-size: 1.1rem; font-weight: bold;">Laddar...</div>
        <div id="last-activity-sub" style="font-size: 0.85rem; color: var(--subtext); margin-top: 4px;">-</div>
    </div>

    <div class="card">
        <div class="card-title">Hälsa & Belastning (Skydda Vad/Häl)</div>
        <div class="metric-grid">
            <div class="metric-box">
                <div style="font-size: 0.8rem; color: var(--subtext);">Snitt Markontakttid</div>
                <div id="gct-val" class="metric-val">- ms</div>
            </div>
            <div class="metric-box">
                <div style="font-size: 0.8rem; color: var(--subtext);">GCT Balans</div>
                <div id="gct-bal-val" class="metric-val">- %</div>
            </div>
            <div class="metric-box">
                <div style="font-size: 0.8rem; color: var(--subtext);">Träningsvolym (7d)</div>
                <div id="vol-7d" class="metric-val">- km</div>
            </div>
            <div class="metric-box">
                <div style="font-size: 0.8rem; color: var(--subtext);">Lågintensivt (80

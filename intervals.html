<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Analytics Hub (Intervals.icu Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-indigo-500/10 text-indigo-400 rounded-xl border border-indigo-500/20">
                    <i data-lucide="zap" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-white">Garmin Hub (Intervals.icu)</h1>
                    <p class="text-xs text-slate-400">Direktintegration utan CSV-filer</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="sendPyramidToday()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold text-white rounded-lg flex items-center gap-1.5 transition shadow">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                    <span>Skicka Pyramiden till Klockan</span>
                </button>
                <button onclick="fetchIntervalsData()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="refreshIcon"></i>
                    <span>Hämta Data</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-6 space-y-6">

        <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-4 flex justify-between items-center">
            <div class="text-xs text-slate-300">
                <span class="font-bold text-white">API-Status:</span> <span id="statusText">Väntar på anrop...</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="configureApiKeys()" class="text-[10px] text-slate-400 hover:text-indigo-400 underline">Ändra API-Uppgifter</button>
                <span id="dataCountBadge" class="px-2.5 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs font-semibold rounded-full">-- Pass Hämtade</span>
            </div>
        </div>

        <!-- Träningspass -->
        <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-5 space-y-3">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4 text-indigo-400"></i> Aktiviteter från Intervals.icu
            </h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-900/60 text-slate-400 uppercase text-[10px]">
                        <tr>
                            <th class="p-2.5">Datum</th>
                            <th class="p-2.5">Aktivitet</th>
                            <th class="p-2.5">Typ</th>
                            <th class="p-2.5">Distans</th>
                            <th class="p-2.5">Tid</th>
                            <th class="p-2.5">Medelpuls</th>
                        </tr>
                    </thead>
                    <tbody id="activitiesTableBody" class="divide-y divide-slate-800 font-mono text-[11px]">
                        <tr>
                            <td colspan="6" class="p-4 text-center text-slate-500">Klicka på "Hämta Data" eller ange dina API-uppgifter för att ladda in passer.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const GITHUB_USERNAME = 'Redbe4rd-glitch';
        const GITHUB_REPO = 'garmin-auto-sync';

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            const savedApiKey = localStorage.getItem('icu_api_key');
            const savedAthleteId = localStorage.getItem('icu_athlete_id');
            if (savedApiKey && savedAthleteId) {
                fetchIntervalsData();
            }
        });

        function configureApiKeys() {
            const apiKey = prompt("Ange din API Key från Intervals.icu:", localStorage.getItem('icu_api_key') || '');
            const athleteId = prompt("Ange ditt Athlete ID från Intervals.icu (t.ex. i12345):", localStorage.getItem('icu_athlete_id') || '');

            if (apiKey && athleteId) {
                localStorage.setItem('icu_api_key', apiKey.trim());
                localStorage.setItem('icu_athlete_id', athleteId.trim());
                fetchIntervalsData();
            }
        }

        async function fetchIntervalsData() {
            const apiKey = localStorage.getItem('icu_api_key');
            const athleteId = localStorage.getItem('icu_athlete_id');

            if (!apiKey || !athleteId) {
                configureApiKeys();
                return;
            }

            const statusText = document.getElementById('statusText');
            const refreshIcon = document.getElementById('refreshIcon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');
            statusText.textContent = "Hämtar data från Intervals.icu...";

            const authHeader = 'Basic ' + btoa('API_KEY:' + apiKey);
            const oldestDate = new Date();
            oldestDate.setDate(oldestDate.getDate() - 30);
            const oldestStr = oldestDate.toISOString().substring(0, 10);

            try {
                const response = await fetch(`https://intervals.icu/api/v1/athlete/${athleteId}/activities?oldest=${oldestStr}`, {
                    headers: { 'Authorization': authHeader }
                });

                if (response.ok) {
                    const data = await response.json();
                    renderActivities(data);
                    statusText.textContent = "Live Ansluten via API";
                } else {
                    statusText.textContent = `Fel vid hämtning (${response.status})`;
                    alert("Kunde inte hämta data. Kontrollera din API-nyckel och Athlete ID.");
                }
            } catch (e) {
                console.error(e);
                statusText.textContent = "Kommunikationsfel";
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin');
            }
        }

        function renderActivities(activities) {
            const tbody = document.getElementById('activitiesTableBody');
            const countBadge = document.getElementById('dataCountBadge');
            tbody.innerHTML = '';
            countBadge.textContent = `${activities.length} Pass Hämtade`;

            if (activities.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-500">Inga aktiviteter hittades för den valda perioden.</td></tr>';
                return;
            }

            activities.sort((a, b) => new Date(b.start_date_local) - new Date(a.start_date_local));

            activities.forEach(act => {
                const date = String(act.start_date_local).substring(0, 10);
                const name = act.name || 'Träningspass';
                const type = act.type || 'Löpning';
                const distKm = act.distance ? (act.distance / 1000).toFixed(2) + ' km' : '-';
                const durMin = act.moving_time ? Math.round(act.moving_time / 60) + ' min' : '-';
                const hr = act.average_heartrate ? Math.round(act.average_heartrate) + ' bpm' : '-';

                tbody.innerHTML += `
                    <tr class="border-b border-slate-800 hover:bg-slate-800/40">
                        <td class="p-2.5 text-slate-400">${date}</td>
                        <td class="p-2.5 font-bold text-white">${name}</td>
                        <td class="p-2.5 text-indigo-400">${type}</td>
                        <td class="p-2.5">${distKm}</td>
                        <td class="p-2.5">${durMin}</td>
                        <td class="p-2.5 text-rose-400">${hr}</td>
                    </tr>
                `;
            });
        }

        async function sendWorkoutToIntervals(workoutDate, workoutText) {
            let token = localStorage.getItem('gh_pat_token');
            if (!token) {
                token = prompt("Ange din GitHub Personal Access Token (PAT):");
                if (token) localStorage.setItem('gh_pat_token', token.trim());
                else return;
            }

            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/actions/workflows/push_workout.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github+json',
                        'Authorization': `Bearer ${token}`,
                        'X-GitHub-Api-Version': '2022-11-28'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            workout_date: workoutDate,
                            workout_text: workoutText
                        }
                    })
                });

                if (response.ok || response.status === 204) {
                    alert("✅ Pyramiden har skickats till Intervals.icu och synkas till din Garmin-klocka inom kort!");
                } else {
                    const err = await response.json().catch(() => ({}));
                    alert(`Kunde inte skicka passet: ${err.message || response.statusText}`);
                }
            } catch (e) {
                console.error(e);
                alert("Ett fel uppstod vid anrop till GitHub Actions.");
            }
        }

        function sendPyramidToday() {
            const today = new Date().toISOString().substring(0, 10);
            const pyramidText = `- 5m Warmup 60-70% HR\n\nMain Set 1x\n- 1m 70-80% HR\n- 30s 50-60% HR\n- 2m 70-80% HR\n- 1m 50-60% HR\n- 3m 70-80% HR\n- 1m 50-60% HR\n- 4m 70-80% HR\n- 1m 50-60% HR\n- 3m 70-80% HR\n- 1m 50-60% HR\n- 2m 70-80% HR\n- 1m 50-60% HR\n- 1m 70-80% HR\n- 30s 50-60% HR\n\n- 5m Cooldown 60-70% HR`;
            
            sendWorkoutToIntervals(today, pyramidText);
        }
    </script>
</body>
</html>
